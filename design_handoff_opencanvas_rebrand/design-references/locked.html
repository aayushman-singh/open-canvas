<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Private site</title>
<script>(function(){try{var t=localStorage.getItem('oc-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Hanken+Grotesk:wght@400;450;500;600;700;800&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { height: 100%; }
  .scene { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; position: relative; }
  .gate { width: 100%; max-width: 400px; text-align: center; }
  .gate .lock { width: 64px; height: 64px; border-radius: 20px; background: var(--red-soft); color: var(--red-ink); display: flex; align-items: center; justify-content: center; margin: 0 auto 22px; }
  .gate h1 { font-size: 28px; letter-spacing: -.02em; }
  .gate p { color: var(--ink-2); font-size: 15px; margin: 10px 0 26px; line-height: 1.5; }
  .gate form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .gate .err { display: none; background: var(--red-soft); border: 1px solid var(--red-line); color: var(--red-ink); font-size: 13px; font-weight: 600; padding: 10px 14px; border-radius: 12px; }
  .gate .err.show { display: block; }
  .powered { position: absolute; bottom: 24px; left: 0; right: 0; display: flex; justify-content: center; }
  .powered a { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); font-weight: 600; }
  .theme-toggle.fixed { position: absolute; top: 22px; right: 22px; }
</style>
</head>
<body>
<div class="scene">
  <button class="theme-toggle fixed" id="themeToggle" aria-label="Toggle theme">
    <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12h2.5M19 12h2.5M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg>
    <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5z"/></svg>
  </button>

  <div class="gate">
    <div class="lock"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
    <h1>This site is private</h1>
    <p>Enter the password to continue. The owner can share it with you.</p>
    <form id="gateForm" onsubmit="return false">
      <div class="err" id="err">That password didn't match. Try again.</div>
      <input class="field" id="pw" type="password" placeholder="Enter password" autofocus />
      <button class="btn btn-primary btn-lg" id="unlock" type="submit">Unlock site</button>
    </form>
  </div>

  <div class="powered">
    <a href="landing.html"><span class="oc-logo" style="color:var(--ink-3)"><svg width="18" height="18" viewBox="0 0 64 64" fill="none"><rect x="14" y="9" width="40" height="46" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="32" r="11" stroke="currentColor" stroke-width="8"/><rect x="40" y="19" width="21" height="4.5" rx="2" fill="var(--red)"/><rect x="6" y="43" width="21" height="4.5" rx="2" fill="var(--red)"/></svg></span>Powered by Open Canvas</a>
  </div>
</div>
<script>
  document.getElementById('themeToggle').addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', cur);
    try { localStorage.setItem('oc-theme', cur); } catch (e) {}
  });
  // demo: 'springtime' unlocks (would be server-verified in the real app)
  document.getElementById('gateForm').addEventListener('submit', function () {
    var v = document.getElementById('pw').value;
    if (v === 'springtime') { window.location.href = 'landing.html'; }
    else { document.getElementById('err').classList.add('show'); }
  });
</script>
</body>
</html>
