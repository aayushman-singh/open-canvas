name: deploy-landing

on:
  push:
    branches: [main]
    paths:
      - 'src/landing/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/deploy-coming-soon.yml'
  workflow_dispatch:

concurrency:
  group: deploy-landing
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: pages deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build landing artifact
        run: |
          bun run landing:preview
          mkdir -p .pages
          cp src/landing/PREVIEW.html .pages/index.html

      - name: Deploy landing to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .pages --project-name rev01-coming-soon --branch main
