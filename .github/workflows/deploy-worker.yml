name: deploy-worker
on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'RECON.md'
      - 'LICENSE'
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run host-config:smoke
      - run: bun run host-literal-guard:smoke
      - run: bun run canvas:smoke
      - run: bun run validate-parity:smoke
      - run: bun run canvas-state-gate:smoke
      - run: bun run inspector-dispatch:smoke
      - run: bun run agent-tool-dispatch:smoke
      - run: bun run sidebar-dispatch:smoke
      - run: bun run yjs-projection:smoke
      - run: bun run canvas-agent:smoke
      - run: bun run ai-rate-limit:smoke
      - run: bun run build

  deploy:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run editor-client:build
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
