name = "rev01"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "rev01.aayushman.dev"
custom_domain = true

# Wildcard for Published Addresses. Workers Custom Domains do not support
# wildcards, so this is a Workers Route on the aayushman.dev zone (no
# `custom_domain = true`). The wildcard CNAME for *.rev01.aayushman.dev is
# already provisioned in Cloudflare DNS.
[[routes]]
pattern = "*.rev01.aayushman.dev/*"
zone_name = "aayushman.dev"

[[durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

# v1 introduced the legacy per-page PageDocument DO (ProseMirror + Yjs).
# v3 drops it after the canvas-first POC (T9) replaced the live-collab
# surface with SiteRoom. The v1 tag must remain so the migration ledger
# stays linear; v3's `deleted_classes` removes the class on next deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageDocument"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SiteRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["PageDocument"]

