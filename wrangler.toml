name = "rev01"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive — Postgres connection pooler in front of the origin database.
# Production origin: laptop Postgres exposed at db.aayushman.dev through
# Cloudflare Access + a cloudflared ingress connector on the laptop. When
# that ingress or local Postgres is down, every authenticated route 500s at
# the first DB query. Repoint after credential rotation:
#   bun run db:hyperdrive:repoint
# Local `wrangler dev` uses the Access TCP client (`bun run db:tunnel`) on
# 127.0.0.1:15433 — not 15432, which belongs to another project's
# pg.aayushman.dev tunnel on this host.
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "fb8eba4bcc154ba196f1d55a8510dd0a"
localConnectionString = "postgresql://admin:admin@127.0.0.1:15433/appdb"

# Workers Logs — persists every invocation's logs (console.* output, thrown
# exceptions with stack traces, request metadata) so we can post-mortem a
# 500 hours after the fact via the Cloudflare dashboard or
# `wrangler tail --since <ts>`. Without this block only live `wrangler tail`
# works, and once the request is gone there is no historical record.
#
# head_sampling_rate = 1 means every request is logged. Free plan retention
# is 3 days and includes 200K invocation logs / day; well above current
# volume. Drop the sampling rate or move to logpush if traffic crosses the
# free-tier cap.
[observability]
enabled = true
head_sampling_rate = 1

[[routes]]
pattern = "opencanvas.aayushman.dev"
custom_domain = true

# Wildcard for Published Addresses. Workers Custom Domains do not support
# wildcards, so this is a Workers Route on the aayushman.dev zone (no
# `custom_domain = true`). The wildcard CNAME for *.opencanvas.aayushman.dev
# must be provisioned in Cloudflare DNS before this route activates.
[[routes]]
pattern = "*.opencanvas.aayushman.dev/*"
zone_name = "aayushman.dev"

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

# Shared Durable Object for form-submit and password-unlock rate limiting.
# Both routes fail closed when this binding is missing.
[[durable_objects.bindings]]
name = "FORM_RATE_LIMITER"
class_name = "FormRateLimiter"

# ADR 0043 Phase D — per-Customer SSE pub-sub hub for live notification
# delivery. One DO instance per Customer (key = customer id); holds open
# SSE response streams from the Customer's dashboard / editor tabs and
# broadcasts pushes from the row writer.
[[durable_objects.bindings]]
name = "NOTIFICATION_OWNER_ROOM"
class_name = "NotificationOwnerRoom"

# v1 introduced the legacy per-page PageDocument DO. v3 drops it after the
# canvas-first POC (T9) replaced the live-collab surface with SiteRoom. The
# v1 tag must remain so the migration ledger stays linear; v3's
# `deleted_classes` removes the class on next deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageDocument"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SiteRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["PageDocument"]

# Register the shared forms/password rate-limiter DO class.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["FormRateLimiter"]

# ADR 0043 Phase D — register the per-Customer notification SSE hub DO class.
[[migrations]]
tag = "v5"
new_sqlite_classes = ["NotificationOwnerRoom"]

# Phase 0 scaffold — Owner Asset originals (ADR 0006 + plan #2). The bucket
# itself is created out-of-band (`wrangler r2 bucket create opencanvas-assets`);
# this binding wires the Worker to it. Wave 1 / Phase 0 asset-pipeline owner
# (Agent 3) populates the read/write paths. ADR 0049 (Accepted 2026-06-09)
# renamed from `rev01-assets` to `opencanvas-assets` via the copy-then-cutover
# playbook; the old bucket stays 30 days as rollback safety.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "opencanvas-assets"

# ADR 0015 Phase 3 — editor-client static asset binding. The build script
# (scripts/build-editor-client.ts) writes the hashed JS + CSS bundles to
# ./dist/_assets/index-<hash>.{js,css}; requests to /_assets/<filename>
# resolve to those files. Any path that does not match a file falls through
# to the Worker (default not_found_handling), preserving the existing
# /dashboard, /__live, /api/* etc. routing. No binding is exported — the
# Worker never reaches into the asset store programmatically, only via
# Cloudflare's static-asset edge cache.
[assets]
directory = "./dist"

# Phase 0 scaffold — sensitive env vars declared here for documentation. The
# real values are NEVER committed; the deploy operator sets each via
# `wrangler secret put <NAME>`. Code reads via `c.env.<NAME>`.
#
# Required by Wave 1 #5 (custom domains, plan 05):
#   CF_API_TOKEN          — Cloudflare API token with Custom Hostnames perms.
#   CF_ZONE_ID            — Zone id under which Custom Hostnames are created.
#
# Required by Wave 2 #7 (forms, plan 07):
#   TURNSTILE_SECRET      — Cloudflare Turnstile server-side verify secret.
#   TURNSTILE_SITE_KEY    — Cloudflare Turnstile public site key.
#   WEBHOOK_SIGNING_SECRET — HMAC-SHA256 secret signing outbound form webhooks.
#
# Required by Wave 2 #9 (password publish, plan 09):
#   UNLOCK_SIGNING_SECRET — HMAC-SHA256 secret. Per ADR 0044 this single
#   secret signs THREE token classes: visitor unlock cookies, editor
#   session tokens, and collaborator invite tokens. Rotation invalidates
#   every issued token in every class at once — there is no partial
#   rotation. See docs/adr/0044-single-hmac-secret-for-signed-tokens.md.
#
# Required by collaborator invitations:
#   RESEND_API_KEY        — Resend.com API key for transactional email.
#
# Required by site import:
#   SCRAPER_URL           — Base URL of the external Playwright scraper service.
#   SCRAPER_API_SECRET    — Shared secret for Worker → scraper auth.
#
# Required by production template source admin:
#   TEMPLATE_SOURCE_GITHUB_TOKEN — GitHub token with branch, contents, and PR
#                                  permissions on TEMPLATE_SOURCE_GITHUB_REPOSITORY.

# [[kv_namespaces]]
# binding = "KV"
# id = "to-be-created"

# Non-secret env vars committed to source so `wrangler deploy` always carries
# them. Previously these were set via the Cloudflare dashboard (Workers →
# Settings → Variables), but plain `wrangler deploy` resets dashboard-set
# values on every deploy — that caused a prod outage on 2026-05-29 when a
# deploy stripped AUTHORIZED_PARTIES and every request 500'd at the Clerk
# middleware boundary. ADR 0013 + ADR 0018 specify these as env-driven;
# putting the canonical Open Canvas values here means a fork rebrands by
# editing this block AND the route patterns above in lockstep.
#
# Update WHEN: the apex hostname in the [[routes]] blocks above changes.
# These must move together; cookie scoping (`cookieDomain`) is `APP_DOMAIN`,
# Clerk's `authenticateRequest` consults `AUTHORIZED_PARTIES`, and the
# outbound sender uses the apex.
[vars]
APP_DOMAIN = "opencanvas.aayushman.dev"
AUTHORIZED_PARTIES = "https://opencanvas.aayushman.dev,http://localhost:8787,http://localhost:8788,http://127.0.0.1:8787,http://127.0.0.1:8788"
COOKIE_NAME_PREFIX = "__opencanvas_"
EMAIL_FROM = "Open Canvas <noreply@opencanvas.aayushman.dev>"
TEMPLATE_SOURCE_GITHUB_REPOSITORY = "aayushman-singh/open-canvas"
TEMPLATE_SOURCE_GITHUB_BASE_BRANCH = "main"
# Customer id that owns the built-in template seeds + their materialized
# assets. The /dashboard/templates seed bootstrap (ensureBuiltInTemplatesSeeded)
# requires this; when unset, requireTemplateAssetCustodianCustomerId throws,
# the bootstrap is skipped, and the Community templates tab renders empty. It
# is a plain DB id (not a secret), so it lives in [vars] to survive every
# `wrangler deploy` — a missing value here was why Community templates were
# blank in production. A fork sets this to its own custodian customer id.
TEMPLATE_ASSET_CUSTODIAN_CUSTOMER_ID = "1ef1a6fa-9b3e-407a-875d-b66d2d01a403"

# Cron triggers. The `scheduled` handler in src/scheduled.ts branches on
# event.cron to dispatch per-feature work:
#   - "0 3 * * *"     ADR 0043 notification retention. Once per day at 03:00
#                     UTC; soft-deletes notification + notification_read
#                     rows older than NOTIFICATION_RETENTION_DAYS (90d).
[triggers]
crons = ["0 3 * * *"]
