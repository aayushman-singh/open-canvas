name = "rev01"
main = "src/index.ts"
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

[[routes]]
pattern = "opencanvas.aayushman.dev"
custom_domain = true

# Wildcard for Published Addresses. Workers Custom Domains do not support
# wildcards, so this is a Workers Route on the aayushman.dev zone (no
# `custom_domain = true`). The wildcard CNAME for *.opencanvas.aayushman.dev
# must be provisioned in Cloudflare DNS before this route activates.
[[routes]]
pattern = "*.opencanvas.aayushman.dev/*"
zone_name = "aayushman.dev"

[[rules]]
type = "Data"
globs = ["**/*.ttf"]
fallthrough = false

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

[[durable_objects.bindings]]
name = "SITE_ROOM"
class_name = "SiteRoom"

# Shared Durable Object for form-submit and password-unlock rate limiting.
# Both routes fail closed when this binding is missing.
[[durable_objects.bindings]]
name = "FORM_RATE_LIMITER"
class_name = "FormRateLimiter"

# v1 introduced the legacy per-page PageDocument DO. v3 drops it after the
# canvas-first POC (T9) replaced the live-collab surface with SiteRoom. The
# v1 tag must remain so the migration ledger stays linear; v3's
# `deleted_classes` removes the class on next deploy.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["PageDocument"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SiteRoom"]

[[migrations]]
tag = "v3"
deleted_classes = ["PageDocument"]

# Register the shared forms/password rate-limiter DO class.
[[migrations]]
tag = "v4"
new_sqlite_classes = ["FormRateLimiter"]

# Phase 0 scaffold — Owner Asset originals (ADR 0006 + plan #2). The bucket
# itself is created out-of-band (`wrangler r2 bucket create rev01-assets`);
# this binding wires the Worker to it. Wave 1 / Phase 0 asset-pipeline owner
# (Agent 3) populates the read/write paths.
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "rev01-assets"

# Phase 0 scaffold — sensitive env vars declared here for documentation. The
# real values are NEVER committed; the deploy operator sets each via
# `wrangler secret put <NAME>`. Code reads via `c.env.<NAME>`.
#
# Required by Wave 1 #5 (custom domains, plan 05):
#   CF_API_TOKEN          — Cloudflare API token with Custom Hostnames perms.
#   CF_ZONE_ID            — Zone id under which Custom Hostnames are created.
#
# Required by Wave 2 #7 (forms, plan 07):
#   TURNSTILE_SECRET      — Cloudflare Turnstile server-side verify secret.
#   TURNSTILE_SITE_KEY    — Cloudflare Turnstile public site key.
#   WEBHOOK_SIGNING_SECRET — HMAC-SHA256 secret signing outbound form webhooks.
#
# Required by Wave 2 #9 (password publish, plan 09):
#   UNLOCK_SIGNING_SECRET — HMAC-SHA256 secret signing visitor unlock cookies.
#
# Required by collaborator invitations:
#   RESEND_API_KEY        — Resend.com API key for transactional email.
#
# Required by site import:
#   SCRAPER_URL           — Base URL of the external Playwright scraper service.
#   SCRAPER_API_SECRET    — Shared secret for Worker → scraper auth.

# [[kv_namespaces]]
# binding = "KV"
# id = "to-be-created"

# Non-secret env vars committed to source so `wrangler deploy` always carries
# them. Previously these were set via the Cloudflare dashboard (Workers →
# Settings → Variables), but plain `wrangler deploy` resets dashboard-set
# values on every deploy — that caused a prod outage on 2026-05-29 when a
# deploy stripped AUTHORIZED_PARTIES and every request 500'd at the Clerk
# middleware boundary. ADR 0013 + ADR 0018 specify these as env-driven;
# putting the canonical Open Canvas values here means a fork rebrands by
# editing this block AND the route patterns above in lockstep.
#
# Update WHEN: the apex hostname in the [[routes]] blocks above changes.
# These must move together; cookie scoping (`cookieDomain`) is `APP_DOMAIN`,
# Clerk's `authenticateRequest` consults `AUTHORIZED_PARTIES`, and the
# outbound sender uses the apex.
[vars]
APP_DOMAIN = "opencanvas.aayushman.dev"
AUTHORIZED_PARTIES = "https://opencanvas.aayushman.dev,http://localhost:8787,http://localhost:8788,http://127.0.0.1:8787,http://127.0.0.1:8788"
COOKIE_NAME_PREFIX = "__opencanvas_"
EMAIL_FROM = "Open Canvas <noreply@opencanvas.aayushman.dev>"

# Wave 1 #5 (custom domains, plan 05). Cron tick every 5 minutes invokes
# the `scheduled` handler exported from src/index.ts which delegates to
# src/custom-domain/cron.ts. The handler polls Cloudflare for pending /
# verifying custom hostnames and reconciles `status` + `certIssuedAt` on
# each row. 30-minute-stuck rows flip to `failed` without hitting CF.
[triggers]
crons = ["*/5 * * * *"]
